name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package-and-release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "发布标签 $env:GITHUB_REF_NAME 与 VERSION 中的 $expectedTag 不一致。"
          }

      - name: Build and test release payload
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'release-build.log'
          try {
            & .\scripts\build-native.ps1 *>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -ne 0) {
              throw "发布构建脚本退出码：$LASTEXITCODE"
            }
          } catch {
            $_ | Out-String | Tee-Object -FilePath $logPath -Append | Write-Host
            throw
          }

      - name: Publish release failure diagnosis
        if: failure()
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'release-build.log'
          if (-not (Test-Path -LiteralPath $logPath)) {
            Write-Host '::error title=Release 失败::发布构建未生成诊断日志。'
            exit 0
          }
          $pattern = '(?i)(MotionWallpaper native tests failed|Native (restore|build|tests) failed|fatal error|:\s*error\s+(MSB|C|LNK|NU)\d+|exception|FFmpeg|退出码|生成失败|测试失败|throw)'
          $matches = @(Select-String -LiteralPath $logPath -Pattern $pattern |
            Select-Object -Last 20 | ForEach-Object {
              $line = $_.Line.Trim()
              if ($line.Length -gt 600) { $line = $line.Substring(0, 600) + '…' }
              $line
            })
          if (-not $matches) {
            $matches = @(Get-Content -LiteralPath $logPath -Tail 30)
          }
          $message = ($matches -join ' | ')
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::error title=Release 诊断::$message"

      - name: Package and validate release archive
        shell: pwsh
        run: .\scripts\package-release.ps1

      - name: Build and validate single EXE installer
        shell: pwsh
        run: |
          .\scripts\install-inno-tool.ps1
          .\scripts\build-installer.ps1 -SkipBuild
          .\scripts\test-installer.ps1

      - name: Create public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\scripts\release-metadata.ps1
          $release = Get-MotionWallpaperReleaseMetadata (Get-Content -LiteralPath VERSION -Raw)
          $version = $release.Version
          $archive = "artifacts/$($release.ArchiveFileName)"
          $checksum = "$archive.sha256"
          $installer = "artifacts/$($release.InstallerFileName)"
          $installerChecksum = "$installer.sha256"
          $notes = @'
          MotionWallpaper {{EDITION}}，面向 Windows 的原生动态壁纸与动态屏保应用。

          ### 主要内容

          - 每块屏幕显示正在应用、已应用、已暂停、正在优化、降级播放或失败，并支持重试与重启渲染。
          - 原画播放和优化副本生成采用静态帧交接，避免两套高负载任务同时运行。
          - 屏保支持立即预览、隐藏鼠标和输入事件即时唤醒。
          - “存储与节能优化”提供预计时间、当前壁纸优先、暂停/取消、磁盘配额和一键释放空间。
          - 媒体库支持搜索、收藏、标签、筛选、多选整理、重复项目修复以及一键备份和恢复。
          - 托盘新增暂停/恢复、下一张、立即屏保与当前状态。
          - 新增工作、夜间、电池和投屏场景，并可通过显示器布局直接分配壁纸。
          - 保留源文件画质；优化副本另行生成，失败时不会覆盖原片。
          - 提供中英文单 EXE 安装器和免安装便携包，均随附 App-local 运行库。
          - 媒体库支持迁移到外置目录，升级、删除和卸载均采用保守的数据保护策略。

          ### 下载与校验

          普通用户建议下载 `{{INSTALLER}}`，可在向导中选择安装位置。免安装使用可下载 `{{ARCHIVE}}`。可使用各自随附的 `.sha256` 文件校验完整性。

          ### 安全提示

          当前安装器尚未代码签名，Windows SmartScreen 可能显示警告。安装版卸载会删除安装目录内的默认壁纸、分组、配置和日志，请提前备份；迁移到安装目录外的媒体库会保留，需由用户自行管理。便携版升级时请保留程序旁的 `Wallpapers` 和 `Config`。

          {{VALIDATION}}
          '@
          $notes = $notes.Replace('{{EDITION}}', $release.EditionName)
          $notes = $notes.Replace('{{INSTALLER}}', $release.InstallerFileName)
          $notes = $notes.Replace('{{ARCHIVE}}', $release.ArchiveFileName)
          $validation = if ($release.IsPrerelease) {
            '这是预发布测试版本，请在非关键设备上使用并通过 Issue 反馈问题。'
          } else {
          @'
          ### 验证范围

          自动化已覆盖 Release x64 构建、原生回归测试、发布负载检查及隔离 AppId 的安装/卸载冒烟测试。本版本尚未完成依赖与随附工具许可证复核、适用地区 H.264 专利许可判断、干净 Windows 10 且无全局 VC++ Runtime 环境、Intel 真机、更多 AMD/NVIDIA 机型、多显示器完整生命周期、睡眠/锁屏/关闭显示器/Explorer 重启，以及最终安装 EXE 的代码签名、SmartScreen 与杀毒软件误报验证。
          '@
          }
          $notes = $notes.Replace('{{VALIDATION}}', $validation)
          $versionNotes = "docs/RELEASE_$version.md"
          if (Test-Path -LiteralPath $versionNotes) {
            $notes = Get-Content -LiteralPath $versionNotes -Raw
            $sourceRoot = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_REF_NAME"
            $notes = [regex]::Replace($notes, '\]\((?![a-zA-Z]+:|#)([^)]+)\)', {
              param($match)
              $path = $match.Groups[1].Value
              if ($path.StartsWith('../')) {
                return "]($sourceRoot/$($path.Substring(3)))"
              }
              return "]($sourceRoot/docs/$path)"
            })
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseArguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            $installer, $installerChecksum, $archive, $checksum,
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', "MotionWallpaper v$version（$($release.EditionName)）",
            '--notes-file', $notesPath,
            '--verify-tag'
          )
          if ($release.IsPrerelease) { $releaseArguments += '--prerelease' }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 创建失败，退出码：$LASTEXITCODE"
          }
